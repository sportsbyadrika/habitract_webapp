  <rect x="245" y="380" width="30" height="45" rx="10" fill="#6366F1"></rect>

  <circle cx="330" cy="360" r="18" fill="#4F46E5"></circle>
  <rect x="315" y="380" width="30" height="45" rx="10" fill="#4F46E5"></rect>

  <circle cx="400" cy="360" r="18" fill="#818CF8"></circle>
  <rect x="385" y="380" width="30" height="45" rx="10" fill="#818CF8"></rect>

