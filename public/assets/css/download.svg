<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background buildings -->
  <rect x="520" y="180" width="120" height="260" rx="10" fill="#E0E7FF"></rect>
  <rect x="660" y="140" width="90" height="300" rx="10" fill="#C7D2FE"></rect>
  <rect x="460" y="220" width="80" height="220" rx="10" fill="#EEF2FF"></rect>

  <!-- Windows -->
  <g fill="#A5B4FC">
